# Standalone Kelly Across Arkansas — static only (no Next server handler).
#
# Connect Netlify to GitHub: Grappe501/reddirt
# Site settings:
#   Base directory: standalone/arkansas-visits
#   Build command:  echo 'arkansas-visits static'
#   Publish directory: .
#   Branch: main (or the branch that contains this folder)
#
# Regenerate from RedDirt repo root after ledger edits:
#   npm run visits:standalone

[build]
  command = "echo 'arkansas-visits static'"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/stop/*"
  to = "/stop.html"
  status = 200
