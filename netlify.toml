# Red Dirt — Netlify
# Production build: `scripts/netlify-build.sh` runs Prisma migrations then `next build`.
# Prisma needs DATABASE_URL at build time. Set it in Netlify env, or rely on Neon’s
# NETLIFY_DATABASE_URL (the script maps it to DATABASE_URL).
# Optional at runtime: OPENAI_* for AI/search. Ingest is manual/scheduled — not in build.
#
# “Whole website” deploy is expected: this repo is one Next.js app (public site + /admin + /dashboard).
# There is no separate Netlify “field-only” bundle unless you split into another repository or site.
# If the GitHub repo root is not this app (e.g. monorepo with RedDirt in a subfolder), set in Netlify UI:
#   Site settings → Build & deploy → Base directory → RedDirt   (or the folder that contains this netlify.toml)
#   If base is the monorepo root, publish becomes /opt/build/repo/.next and the server handler can exceed 250 MB.
#   Base directory MUST be RedDirt; leave Publish directory empty (Next plugin uses .next under base).
#
# Publish directory (Netlify UI):
#   `publish: .next` with the Next.js Runtime is normal (the runtime’s default is `.next`).
#   Do NOT point "Publish directory" at the repo root or a folder without a Next `BUILD_ID` —
#   that breaks the runtime and can produce broken / oversized deploy artifacts.
#   If you changed publish away from `.next`, reset Site settings → Build → Publish directory to
#   empty so the framework preset applies, or set it explicitly to `.next` for this app root.

[build]
  command = "bash scripts/netlify-build.sh"
  publish = ".next"

# Option A — branch deploys: enable in Netlify UI → Build & deploy → Branches → "All branches"
# or deploy only feature/kelly-schedule-settlement-dashboard for Kelly search testing.
# Branch URL pattern: https://<branch-slug>--<site-name>.netlify.app
[context.branch-deploy]
  command = "bash scripts/netlify-build.sh"

[context.deploy-preview]
  command = "bash scripts/netlify-build.sh"

[build.environment]
  NODE_VERSION = "22"
  # Do not set NODE_ENV=production here — Netlify npm install would omit devDependencies
  # (typescript required for next.config.ts). netlify-build.sh sets production for next build only.
  NPM_CONFIG_PRODUCTION = "false"
  # NODE_OPTIONS heap is set only in scripts/netlify-build.sh during `next build` —
  # do NOT declare here; Netlify UI vars scoped to All/Functions break Lambda deploy.
  # Kelly SOS full ops — admin + election-plan + volunteer boards (not opposition-only strip)
  NEXT_PUBLIC_INTELLIGENCE_LAUNCH_MODE = "kelly_sos_ops"
  # County clerks tour — clerk-first nav + hub copy (see debateAudienceMode.ts)
  NEXT_PUBLIC_DEBATE_PRIMARY_AUDIENCE = "county_clerks"
  # Candidate iPad 11" — bottom nav, touch targets, copilot sheet (set false on staff-only builds)
  NEXT_PUBLIC_CANDIDATE_IPAD_MODE = "true"

# Next.js OpenNext adapter — Netlify applies @netlify/plugin-nextjs automatically for Next.js sites.
# Do NOT add [[plugins]] package = "@netlify/plugin-nextjs" here — Netlify docs: pinning via netlify.toml
# can stick the site on legacy Lambda compat (4 KB env cap + FEATURE_FLAGS deploy failures).
# Do NOT pin in package.json either. Custom onPostBuild plugins below run after the auto adapter.
# If deploy fails with "handler not found", Netlify UI → Build settings → Runtime → re-select Next.js.

[[plugins]]
  package = "./netlify/plugins/prune-server-handler"

[[plugins]]
  package = "./netlify/plugins/lambda-env-guard"

# Netlify upload cap is 250 MB unzipped per function.
# Do not use external_node_modules here — it copies whole packages into the upload and blows the cap.
[functions."___netlify-server-handler"]
  included_files = [
    "!.git/**",
    "!.git/objects/**",
    "!node_modules/.prisma/client/libquery_engine-rhel-openssl-1.0.x.so.node",
    "!node_modules/@img/sharp-libvips-linuxmusl-x64/**",
    "!node_modules/@img/sharp-linuxmusl-x64/**",
    "!node_modules/pdf-parse/**",
    "!node_modules/@googleapis/**",
    "!node_modules/googleapis/**",
    "!node_modules/google-auth-library/**",
    "!node_modules/twilio/**",
    "!node_modules/mammoth/**",
    "!node_modules/xlsx/**",
    "!node_modules/typescript/**",
    "!node_modules/webpack/**",
    "!data/calendar-command-center/**",
    "!data/campaign-events/**",
    "!data/compliance/**",
    "!data/county-workbench/**",
    "!data/election/**",
    "!data/simulations/**",
    "!data/intelligence/briefs/**",
    "!data/intelligence/backups/**",
    "!data/campaign-brain/city-intelligence-profiles.json",
    "!data/campaign-brain/kelly-voter-audience-models.json",
    "!data/campaign-brain/media-outreach/**",
    "!data/campaign-brain/fairs-festivals/**",
    "!data/campaign-brain/calendar-settlement/**",
    "!data/campaign-brain/county-coverage/**",
    "!data/campaign-brain/executive-book/**",
    "!data/campaign-brain/operations-lock/**",
    "!data/owned-campaign-media/**",
    "!public/**",
    "!.tmp-heic-preview/**",
    "!docs/kelly-grappe-sos-strategic-plan-manual/**",
    "!campaign-system-manual/**",
    "!.local/**",
    "!**/.local/**",
    "!**/npm-cache/**",
    "!**/_cacache/**",
  ]

