# Production deploy gate — mirrors Netlify build (Prisma migrate + next build).
# Netlify's GitHub integration also builds on push to main; this workflow validates
# the same path in CI before/alongside the Netlify webhook.
#
# Optional: set NETLIFY_BUILD_HOOK in repo secrets to POST a build after CI passes.

name: Netlify production deploy gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: reddirt
          POSTGRES_PASSWORD: reddirt
          POSTGRES_DB: reddirt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reddirt -d reddirt"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://reddirt:reddirt@127.0.0.1:5432/reddirt
      DIRECT_URL: postgresql://reddirt:reddirt@127.0.0.1:5432/reddirt
      ADMIN_SECRET: ci-placeholder-not-for-production
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Production build (netlify-build.sh parity)
        run: npm run election-plan:build && NODE_ENV=production npx next build

      - name: Enforce Netlify env scopes (when secrets set)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "Skip env scope enforcement — add NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID to GitHub repo secrets."
            exit 0
          fi
          node scripts/netlify-enforce-env-scopes.cjs

      - name: Trigger Netlify build hook (optional)
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "${NETLIFY_BUILD_HOOK:-}" ]; then
            curl -fsS -X POST -d {} "$NETLIFY_BUILD_HOOK"
          else
            echo "NETLIFY_BUILD_HOOK not set — Netlify GitHub integration handles deploy on push to main."
          fi
