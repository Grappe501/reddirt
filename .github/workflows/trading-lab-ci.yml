name: Trading Lab CI

on:
  push:
    paths:
      - 'trading-lab/**'
      - '.github/workflows/trading-lab-ci.yml'
  pull_request:
    paths:
      - 'trading-lab/**'
      - '.github/workflows/trading-lab-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trading-lab/package.json
      - name: Install dependencies
        run: npm install
      - name: Test and build
        run: npm run check
