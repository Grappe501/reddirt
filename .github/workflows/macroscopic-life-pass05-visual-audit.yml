name: Macroscopic Life Pass 05 Visual Audit

on:
  push:
    paths:
      - 'research/macroscopic-life/scripts/audit-book-one-visual-proof-v02.py'
      - 'research/macroscopic-life/production/PRODUCTION-PASS-05.trigger'
      - '.github/workflows/macroscopic-life-pass05-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF audit dependency
        run: pip install pypdf
      - name: Verify frozen v0.2 structural baseline
        run: |
          test -s research/macroscopic-life/production/proofs/MACROSCOPIC-LIFE-BOOK-ONE-6x9-PROOF-v0.2.pdf
          grep -Fx 'overall_status=PASS' research/macroscopic-life/production/proofs/MACROSCOPIC-LIFE-BOOK-ONE-6x9-PROOF-v0.2-INSPECTION.txt
      - name: Build complete Pass 05 page and spread suspicion ledger
        run: python research/macroscopic-life/scripts/audit-book-one-visual-proof-v02.py
      - name: Enforce complete 180-page ledger
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('research/macroscopic-life/production/proofs')
          j=json.loads((root/'MACROSCOPIC-LIFE-BOOK-ONE-6x9-PROOF-v0.2-VISUAL-AUDIT.json').read_text())
          assert j['summary']['page_count']==180
          assert j['summary']['visual_pages_pending']==180
          with (root/'MACROSCOPIC-LIFE-BOOK-ONE-6x9-PROOF-v0.2-VISUAL-DEFECT-LEDGER.csv').open(encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==180
          print('complete visual review queue:',len(rows),'pages')
          PY
      - name: Commit Pass 05 audit queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/macroscopic-life/production/proofs/MACROSCOPIC-LIFE-BOOK-ONE-6x9-PROOF-v0.2-VISUAL-DEFECT-LEDGER.csv
          git add research/macroscopic-life/production/proofs/MACROSCOPIC-LIFE-BOOK-ONE-6x9-PROOF-v0.2-VISUAL-AUDIT.json
          git add research/macroscopic-life/production/proofs/MACROSCOPIC-LIFE-BOOK-ONE-6x9-PROOF-v0.2-VISUAL-AUDIT.md
          if git diff --cached --quiet; then
            echo 'Pass 05 audit artifacts unchanged.'
          else
            git commit -m 'Macroscopic Life: generate Pass 05 visual audit queue [skip pass05-audit]'
            git push
          fi
