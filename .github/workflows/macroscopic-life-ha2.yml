name: Macroscopic Life HA2 physical build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macroscopic-life-ha2.yml'
      - 'research/macroscopic-life/scripts/promote-hostile-audit-remediation-pass-02.mjs'
      - 'research/macroscopic-life/scripts/materialize-book-one-master-pub-9c.mjs'
      - 'research/macroscopic-life/scripts/promote-pub-9c-r9-reader-revisions.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ha2:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch known R9 validator mismatch in runner only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/macroscopic-life/scripts/promote-pub-9c-r9-reader-revisions.mjs')
          s=p.read_text()
          old="if (!text.includes('INTEGRATION → HIGHER-ORDER INDIVIDUALITY') && k!=='act5')"
          new="if (!text.includes('INTEGRATION → HIGHER-ORDER INDIVIDUALITY') && !text.includes('## Pattern, Organization, Integration, Individual') && k!=='act5')"
          if old not in s: raise SystemExit('Expected R9 validator line not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Scope duplicated Chapter 12 collective-intelligence anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/macroscopic-life/scripts/promote-hostile-audit-remediation-pass-02.mjs')
          s=p.read_text()
          old="act4 = insertAfterPartialLock(act4, '> **THE WHOLE CAN SOLVE A PROBLEM THAT NO SINGLE COMPONENT SOLVES ALONE.**', 'THAT DOES NOT BY ITSELF ESTABLISH ONE AGENT.', '> **THE WHOLE CAN SOLVE A PROBLEM NO COMPONENT SOLVES ALONE; THAT DOES NOT BY ITSELF ESTABLISH ONE AGENT.**', 'P1-11 collective intelligence brake');"
          replacement="{\n  const chapterStart = act4.indexOf('# Chapter 12 —');\n  const chapterEnd = act4.indexOf('# Chapter 13 —', chapterStart);\n  if (chapterStart < 0 || chapterEnd < 0) throw new Error('P1-11 collective intelligence brake: Chapter 12 scope not found');\n  const before = act4.slice(0, chapterStart);\n  const chapter = act4.slice(chapterStart, chapterEnd);\n  const after = act4.slice(chapterEnd);\n  act4 = before + insertAfterPartialLock(chapter, '> **THE WHOLE CAN SOLVE A PROBLEM THAT NO SINGLE COMPONENT SOLVES ALONE.**', 'THAT DOES NOT BY ITSELF ESTABLISH ONE AGENT.', '> **THE WHOLE CAN SOLVE A PROBLEM NO COMPONENT SOLVES ALONE; THAT DOES NOT BY ITSELF ESTABLISH ONE AGENT.**', 'P1-11 collective intelligence brake') + after;\n}"
          if s.count(old)!=1: raise SystemExit(f'Expected one promoter call, found {s.count(old)}')
          p.write_text(s.replace(old,replacement))
          PY
      - name: Generate HA2 derivatives
        run: node research/macroscopic-life/scripts/promote-hostile-audit-remediation-pass-02.mjs
      - name: Materialize PUB-9C master
        run: node research/macroscopic-life/scripts/materialize-book-one-master-pub-9c.mjs
      - name: Frozen-source guard
        run: git diff --exit-code -- research/macroscopic-life/manuscript/pub-7l-r1-act-i-redundancy-cut-reader-manuscript.md research/macroscopic-life/manuscript/pub-7l-r1-act-ii-redundancy-cut-reader-manuscript.md research/macroscopic-life/manuscript/pub-7l-r1-act-iii-redundancy-cut-reader-manuscript.md research/macroscopic-life/manuscript/pub-7l-r1-act-iv-redundancy-cut-reader-manuscript.md research/macroscopic-life/manuscript/pub-7l-r1-act-v-redundancy-cut-reader-manuscript.md
      - name: Commit physical proof
        run: |
          git checkout -- research/macroscopic-life/scripts/promote-pub-9c-r9-reader-revisions.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/macroscopic-life/scripts/promote-hostile-audit-remediation-pass-02.mjs research/macroscopic-life/manuscript/pub-9c-r9-act-ii-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-r9-act-iv-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-r9-act-v-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-i-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-ii-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-iii-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-iv-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-v-reader-manuscript.md research/macroscopic-life/manuscript/book-one-master-pub-9c-reader-materialized.md
          if ! git diff --cached --quiet; then
            git commit -m 'Hostile audit remediation pass 2: materialize HA2 physical reader master [skip ci]'
            git push origin HEAD:main
          fi
