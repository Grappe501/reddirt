name: Macroscopic Life HA2 physical build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macroscopic-life-ha2.yml'
      - 'research/macroscopic-life/scripts/promote-hostile-audit-remediation-pass-02.mjs'
      - 'research/macroscopic-life/scripts/materialize-book-one-master-pub-9c.mjs'
      - 'research/macroscopic-life/scripts/promote-pub-9c-r9-reader-revisions.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ha2:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate HA2 derivatives
        run: node research/macroscopic-life/scripts/promote-hostile-audit-remediation-pass-02.mjs
      - name: Materialize PUB-9C master
        run: node research/macroscopic-life/scripts/materialize-book-one-master-pub-9c.mjs
      - name: Frozen-source guard
        run: git diff --exit-code -- research/macroscopic-life/manuscript/pub-7l-r1-act-i-redundancy-cut-reader-manuscript.md research/macroscopic-life/manuscript/pub-7l-r1-act-ii-redundancy-cut-reader-manuscript.md research/macroscopic-life/manuscript/pub-7l-r1-act-iii-redundancy-cut-reader-manuscript.md research/macroscopic-life/manuscript/pub-7l-r1-act-iv-redundancy-cut-reader-manuscript.md research/macroscopic-life/manuscript/pub-7l-r1-act-v-redundancy-cut-reader-manuscript.md
      - name: Commit physical proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f research/macroscopic-life/manuscript/pub-9c-r9-act-ii-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-r9-act-iv-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-r9-act-v-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-i-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-ii-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-iii-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-iv-reader-manuscript.md research/macroscopic-life/manuscript/pub-9c-ha2-act-v-reader-manuscript.md research/macroscopic-life/manuscript/book-one-master-pub-9c-reader-materialized.md
          if ! git diff --cached --quiet; then
            git commit -m 'Hostile audit remediation pass 2: materialize HA2 physical reader master [skip ci]'
            git push origin HEAD:main
          fi
