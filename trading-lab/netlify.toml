[build]
  command = "npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # Durable functions use modern default exports. A named `handler` export
  # forces Lambda compatibility and drops the automatic Netlify Database binding.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
