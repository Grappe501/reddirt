<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kelly Grappe for Secretary of State — Statewide Volunteer Leadership Kickoff. Follow along and choose how you will help."
    />
    <title>Volunteer Leadership Kickoff | Kelly Grappe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700&family=Raleway:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Netlify Forms detection (SPA) -->
    <form name="kickoff-signup" netlify netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="kickoff-signup" />
      <input name="pathway" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="county" />
      <input name="city" />
      <input name="roles" />
      <input name="primaryTeam" />
      <input name="availability" />
      <input name="notes" />
      <input name="eventInterest" />
      <input name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
