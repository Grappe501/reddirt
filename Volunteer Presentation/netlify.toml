# Kelly Grappe — Statewide Volunteer Leadership Kickoff
# Static presentation site (no Next serverless / Prisma).
# Forms use Netlify Forms until RedDirt production deploys are unblocked.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
